{% extends 'base.html' %}{% block title %}Equipe · Barbearia{% endblock %}{% block content %}<a class="back" href="{{ url_for('home') }}">← Início</a><section class="form-page wide-page"><span class="kicker">GESTÃO DA EQUIPE</span><h1>Acessos de barbeiro<span class="gold">.</span></h1><form method="post" class="panel form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome<input name="name" required maxlength="100"></label><label>E-mail<input name="email" type="email" required></label><label>Senha inicial<input name="password" type="password" minlength="8" required></label><button class="button gold-button">Criar acesso →</button></form><h2 class="subheading">Equipe cadastrada</h2>{% for b in barbers %}<div class="panel barber-row"><strong>{{ b.name }}</strong><span>{{ b.email }}</span></div>{% else %}<div class="panel empty">Nenhum barbeiro cadastrado ainda.</div>{% endfor %}</section>{% endblock %}
