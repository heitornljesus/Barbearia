{% extends 'base.html' %}{% block title %}Adicionar produto · Barbearia{% endblock %}{% block content %}<a class="back" href="{{ url_for('home') }}">← Início</a><section class="form-page"><span class="kicker">VITRINE DA BARBEARIA</span><h1>Novo produto<span class="gold">.</span></h1><p>Cadastre pomadas, gel, shampoo e outros produtos para seus clientes.</p><form class="panel form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome do produto<input name="name" required maxlength="120" placeholder="Ex.: Pomada modeladora"></label><label>Descrição<textarea name="description" rows="3" maxlength="500" placeholder="Detalhes do produto"></textarea></label><label>Preço (R$)<input name="price" required type="number" min="0" step="0.01" placeholder="0,00"></label><label>Foto<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG ou WebP; até 8 MB.</small></label><button class="button gold-button">Publicar produto →</button></form></section>{% endblock %}
